name: Daily LHC Data Scrape

on:
  schedule:
    - cron: "0 5 * * *"   # 5:00 AM UTC = 10:00 AM PKT daily — adjust as needed
  workflow_dispatch:        # allows manual "Run workflow" button too

permissions:
  contents: write

jobs:
  scrape-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests beautifulsoup4 pandas openpyxl

      - name: Run scraper
        run: python scraper.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add combined_data.xlsx
          git diff --staged --quiet && echo "No changes to commit" || git commit -m "Auto-update: daily LHC cause list scrape"
          git push origin HEAD:main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
